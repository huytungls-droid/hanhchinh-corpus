name: Thu thap van ban hanh chinh

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Thu thap Dak Lak
        run: |
          python collector_daklak.py

      - name: Kiem tra ket qua
        run: |
          echo "So file TXT:"
          find corpus -type f -name "*.txt" | wc -l

          echo "Danh sach:"
          find corpus -type f -name "*.txt" | head -20

      - name: Upload corpus
        uses: actions/upload-artifact@v4
        with:
          name: daklak-test-corpus
          path: corpus/
          retention-days: 7
