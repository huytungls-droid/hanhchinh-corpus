name: Thu thap van ban hanh chinh

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Chay thu Python
        run: |
          python test.py

      - name: Dong goi ket qua
        run: |
          cd output
          zip -r ../ket_qua_thu.zip .
          cd ..

      - name: Luu file de tai ve
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-thu
          path: ket_qua_thu.zip
          retention-days: 7
